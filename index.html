<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novarevolt | Premium Streetwear</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        /* CSS Reset & Core Variables - Extreme Luxury Minimalist Theme */
        :root {
            --bg-color: #F8F7F4; /* Very High-End Editorial Beige/Off-white */
            --surface-color: #FFFFFF;
            --text-color: #000000;
            --text-secondary: #888888;
            --cta-color: #000000;
            --border-color: #E6E4DD;
            --nav-height: 65px;
            --transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            overflow-x: hidden;
            width: 100vw;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #splash-screen h1 {
            font-size: 2.5rem; text-transform: uppercase; letter-spacing: 0.35em; font-weight: 800;
            color: #FFFFFF; animation: pulse 2s infinite; margin-left: 0.35em; /* Optical centering */
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d1d1; }

        /* Typography & Utilities */
        h1, h2, h3, h4, h5, h6 { font-weight: 700; letter-spacing: -0.02em; text-transform: uppercase; }
        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; transition: var(--transition); }
        img, video { max-width: 100%; display: block; }
        .hidden { display: none !important; }
        
        /* Layout Structure */
        #app-container { padding-bottom: calc(var(--nav-height) + 20px); min-height: 100vh; position: relative; }
        .screen { display: none; animation: fadeIn 0.5s ease forwards; max-width: 1200px; margin: 0 auto; }
        .screen.active { display: block; }
        .content-wrapper { padding: 0 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Loaders */
        #global-loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(248, 247, 244, 0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .spinner {
            width: 35px; height: 35px; border: 2px solid var(--border-color);
            border-top-color: var(--text-color); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Header - Sharp Minimal & Mobile Friendly Fix */
        header {
            text-align: center; padding: 20px 10px 15px 10px; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 100;
        }
        header h1 { 
            font-size: 1.25rem; /* Reduced for mobile */
            letter-spacing: 0.15em; 
            color: #000; 
            font-weight: 800; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Search Bar Setup (Sleek) */
        .search-container { padding: 15px 15px 5px 15px; position: relative; background: var(--bg-color); }
        .search-input {
            width: 100%; padding: 12px 15px 12px 40px; border: none; border-bottom: 1px solid var(--text-color);
            border-radius: 0; font-size: 0.9rem; background: transparent; outline: none;
            text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;
        }
        .search-input::placeholder { color: #aaa; }
        .search-icon {
            position: absolute; left: 15px; top: 25px;
            width: 16px; height: 16px; stroke: var(--text-color); fill: none; stroke-width: 2;
        }

        /* Bottom Navigation - Pure Sharp Theme */
        nav.bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: #ffffff; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #b0b0b0; font-size: 0.65rem; width: 100%; height: 100%; position: relative;
            text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
        }
        .nav-item svg { width: 20px; height: 20px; margin-bottom: 4px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .nav-item.active { color: #000000; }
        .cart-badge {
            position: absolute; top: 10px; right: 28%; background: #000; color: #fff;
            font-size: 0.6rem; font-weight: bold; width: 16px; height: 16px; display: flex;
            justify-content: center; align-items: center; border-radius: 50%;
        }

        /* Home Feed - Banners Fix (Smaller Height) */
        .banner-slider {
            position: relative; width: 100vw; 
            aspect-ratio: 1 / 1; /* Changed from 4/5 so it's not overly huge */
            max-height: 60vh; /* Limits maximum height on tall phones */
            overflow: hidden; margin-bottom: 40px; background: #eee;
        }
        @media(min-width: 768px) { .banner-slider { aspect-ratio: 16/9; max-width: 100%; max-height: none; } }
        .banner-track { display: flex; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); height: 100%; }
        .banner-slide { min-width: 100%; height: 100%; position: relative; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }
        /* Dark gradient overlay on banner bottom for premium look */
        .banner-slide::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
            background: linear-gradient(to top, rgba(0,0,0,0.3), transparent); pointer-events: none;
        }

        /* 2-Column Large Product Grid */
        .section-header { margin: 0 15px 25px 15px; text-align: center; }
        .section-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.1em; }
        
        .product-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* STRICTLY 2 COLUMNS FOR BIG CARDS */
            gap: 25px 10px; /* Big vertical gap, tight horizontal gap */
            padding: 0 10px;
        }
        
        .product-card { cursor: pointer; text-align: left; display: flex; flex-direction: column; }
        
        .product-image-container {
            width: 100%; aspect-ratio: 3 / 4; /* STRICT TALL RATIO */
            overflow: hidden; background: #EBE8E3; margin-bottom: 12px; position: relative;
        }
        .product-image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s ease; }
        .product-card:hover .product-image-container img { transform: scale(1.05); }
        
        .product-info { padding: 0 5px; display: flex; flex-direction: column; gap: 2px; }
        .product-title {
            font-size: 0.85rem; font-weight: 700; color: var(--text-color);
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden; width: 100%;
        }
        
        .product-price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
        .price-current { font-size: 0.95rem; font-weight: 600; color: var(--text-color); }
        .price-original { font-size: 0.8rem; color: #999; text-decoration: line-through; }

        /* Product Details Screen */
        .pd-layout { display: flex; flex-direction: column; }
        @media (min-width: 768px) { .pd-layout { flex-direction: row; gap: 40px; padding: 20px;} .pd-media, .pd-details { flex: 1; } }
        /* Full width image on mobile */
        .pd-media { width: 100vw; margin-left: -15px; aspect-ratio: 3/4; background: #e0ddd8; overflow: hidden; position: relative; }
        @media (min-width: 768px) { .pd-media { width: 100%; margin-left: 0; } }
        .pd-media img, .pd-media video { width: 100%; height: 100%; object-fit: cover; }
        
        .pd-details { padding: 25px 0; }
        .pd-title { font-size: 1.8rem; margin-bottom: 5px; font-weight: 800; }
        .pd-price { font-size: 1.3rem; font-weight: 600; margin-bottom: 25px; }
        
        .selector-group { margin-bottom: 30px; }
        .selector-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; display: block; color: var(--text-secondary); font-weight: 600; }
        .selector-options { display: flex; flex-wrap: wrap; gap: 10px; }
        .selector-btn {
            padding: 12px 20px; border: 1px solid var(--border-color); background: var(--surface-color);
            font-size: 0.85rem; border-radius: 0; font-weight: 600; transition: 0.2s; text-transform: uppercase;
        }
        .selector-btn.selected { border-color: var(--text-color); background: var(--text-color); color: var(--surface-color); }
        
        .qty-wrapper { display: flex; align-items: center; border: 1px solid var(--border-color); width: max-content; background: var(--surface-color); }
        .qty-btn { padding: 12px 20px; font-size: 1.1rem; }
        .qty-val { padding: 0 15px; font-size: 1rem; font-weight: 600; }

        .btn-primary {
            width: 100%; padding: 18px; background: var(--cta-color); color: #ffffff;
            font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em;
            margin-top: 10px; border-radius: 0; text-align: center; display: block; transition: 0.3s;
        }
        .btn-primary:active { transform: scale(0.98); background: #222; }

        /* Dynamic Reviews Section */
        .reviews-section { margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--border-color); }
        .review-item { margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #eee; }
        .review-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .review-avatar { width: 35px; height: 35px; background: var(--text-color); color:var(--surface-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size:0.9rem; text-transform: uppercase; }
        .review-name { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .review-text { font-size: 0.95rem; color: #444; line-height: 1.6; }
        
        /* Review Form */
        .add-review-box { margin-top: 30px; padding: 25px; background: #fff; border: 1px solid var(--border-color); }
        .star-rating-input { font-size: 1.8rem; color: #e0e0e0; cursor: pointer; margin-bottom: 15px; }
        .star-rating-input span:hover, .star-rating-input span.active { color: #000; }

        /* Auth & Checkout Modals (Sharp edges) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 2000;
            display: flex; justify-content: center; align-items: flex-end;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        @media (min-width: 768px) { .modal-overlay { align-items: center; } }
        .modal-content {
            background: var(--bg-color); width: 100%; max-width: 500px;
            padding: 40px 25px; border-radius: 0; /* Sharp for luxury */
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .form-group { margin-bottom: 25px; }
        .form-label { display: block; font-size: 0.75rem; margin-bottom: 8px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
        .form-input {
            width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid #ccc;
            border-radius: 0; font-family: inherit; font-size: 1rem; background: transparent; color: var(--text-color);
            outline: none; transition: 0.3s;
        }
        .form-input:focus { border-color: #000; }

        .auth-toggle { text-align: center; font-size: 0.8rem; margin-top: 25px; color: var(--text-secondary); cursor: pointer; text-decoration: underline; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .btn-google {
            background: #fff; color: #000; border: 1px solid #000; width: 100%; padding: 15px;
            display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: 600; margin-top: 15px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;
        }

        /* Cart & Orders */
        .cart-item { display: flex; gap: 20px; padding: 25px 0; border-bottom: 1px solid var(--border-color); }
        .cart-item-img { width: 90px; aspect-ratio: 3/4; background: #e0ddd8; object-fit: cover; }
        .cart-item-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-item-title { font-size: 0.95rem; font-weight: 700; }
        .cart-item-price { font-size: 1.1rem; font-weight: 600; margin-top: auto; }
        .cart-remove { font-size: 0.75rem; color: #000; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #000; padding-bottom: 2px; }
        
        .order-card { padding: 25px; border: 1px solid var(--border-color); background: #fff; margin-bottom: 20px; }
        
        /* Reels */
        #reels-screen { padding: 0; max-width: 100%; height: calc(100vh - var(--nav-height)); background: #000; overflow: hidden; }
        .reels-container { height: 100%; width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel-item { height: 100%; width: 100%; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
        .reel-video { width: 100%; height: 100%; object-fit: cover; }
        
        /* General Utils */
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #000; color: #fff; padding: 15px 30px;
            font-size: 0.85rem; z-index: 3000; transition: transform 0.4s ease; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 0;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <h1>NOVAREVOLT</h1>
    </div>

    <!-- Global Loader -->
    <div id="global-loader" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"></div>

    <header>
        <h1>NOVAREVOLT</h1>
    </header>

    <div id="app-container">
        
        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen active">
            
            <div class="search-container">
                <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search Collection" onkeyup="window.app.handleSearch()">
            </div>

            <!-- Full Bleed Massive Banner (Size Fixed) -->
            <div class="banner-slider">
                <div class="banner-track" id="banner-track"></div>
            </div>
            
            <div class="section-header">
                <h2 class="section-title">New Arrivals</h2>
            </div>
            
            <!-- 2-Column Large Product Grid -->
            <div class="product-grid" id="home-product-grid">
                <!-- Products injected via JS -->
            </div>
        </div>

        <!-- REELS SCREEN -->
        <div id="reels-screen" class="screen">
            <div class="reels-container" id="reels-container"></div>
        </div>

        <!-- CART SCREEN -->
        <div id="cart-screen" class="screen content-wrapper">
            <h2 class="section-title" style="margin-top: 20px; font-size: 1.5rem;">Your Cart</h2>
            <div id="cart-container"></div>
            <div id="cart-summary-wrapper" class="hidden">
                <div style="margin-top: 30px; padding: 25px; background: #fff; border: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color:var(--text-secondary); font-weight:600; text-transform:uppercase;"><span>Subtotal</span><span id="cart-subtotal" style="color:var(--text-color);">₹0</span></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color:var(--text-secondary); font-weight:600; text-transform:uppercase;"><span>Shipping</span><span style="color:var(--text-color);">Complimentary</span></div>
                    <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.3rem; border-top: 1px solid var(--border-color); padding-top: 20px; margin-top: 15px;"><span>Total</span><span id="cart-total">₹0</span></div>
                </div>
                <button class="btn-primary" style="margin-top:20px;" onclick="window.app.openCheckout()">Proceed to Checkout</button>
            </div>
        </div>

        <!-- ORDERS SCREEN -->
        <div id="orders-screen" class="screen content-wrapper">
            <h2 class="section-title" style="margin-top: 20px; font-size: 1.5rem; margin-bottom: 25px;">Order History</h2>
            <div id="orders-container"></div>
        </div>

        <!-- PRODUCT DETAILS SCREEN -->
        <div id="product-detail-screen" class="screen">
            <div id="pd-content" class="content-wrapper"></div>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px;">
                <h3 id="auth-title" style="font-size: 1.5rem; font-weight: 800; letter-spacing: 0.1em;">LOGIN</h3>
                <button style="font-size: 2rem; line-height: 1; color: #000;" onclick="window.app.closeAuth()">&times;</button>
            </div>
            
            <form id="auth-form" onsubmit="window.app.handleEmailAuth(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="auth-email" class="form-input" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="auth-pass" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="btn-auth-submit" style="margin-top:20px;">Sign In</button>
            </form>

            <div style="text-align: center; margin: 30px 0; color: #000; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em;">OR</div>

            <button class="btn-google" onclick="window.app.handleGoogleLogin()">
                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Sign in with Google
            </button>
            <div class="auth-toggle" id="auth-toggle-text" onclick="window.app.toggleAuthMode()">Create an account</div>
        </div>
    </div>

    <!-- CHECKOUT MODAL (With Location Logic intact) -->
    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h3 style="font-size: 1.5rem; font-weight: 800; letter-spacing: 0.1em;">CHECKOUT</h3>
                <button style="font-size: 2rem; line-height: 1; color: #000;" onclick="window.app.closeCheckout()">&times;</button>
            </div>
            <form id="checkout-form" onsubmit="window.app.placeOrder(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="co-name" class="form-input" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="co-phone" class="form-input" required placeholder="+91 9876543210">
                </div>
                <div class="form-group">
                    <label class="form-label">Delivery Address</label>
                    <textarea id="co-address" class="form-input" required placeholder="Apartment, suite, etc." style="resize:vertical; min-height:60px; padding-top:10px;"></textarea>
                </div>
                
                <!-- GPS FEATURE (Unchanged Logic, Premium UI) -->
                <div class="form-group" style="margin-bottom: 35px; background: #fafafa; padding: 20px; border: 1px solid var(--border-color);">
                    <label class="form-label" style="font-size:0.7rem;">Precise Location (Recommended)</label>
                    <button type="button" class="btn-primary" style="background: transparent; color: #000; border: 1px solid #000; margin-top: 10px; padding: 12px; font-size: 0.75rem;" onclick="window.app.fetchLocation()">Use Current Location GPS</button>
                    <input type="hidden" id="co-gps-link">
                    <div id="co-gps-status" style="font-size: 0.75rem; margin-top: 10px; font-weight: 600; text-transform:uppercase; letter-spacing:0.05em;"></div>
                </div>

                <button type="submit" class="btn-primary" id="btn-place-order">Complete Purchase</button>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.app.navigate('home')">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="window.app.navigate('reels')">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
            <span>Discover</span>
        </button>
        <button class="nav-item" onclick="window.app.navigate('orders')">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            <span>Orders</span>
        </button>
        <button class="nav-item" onclick="window.app.navigate('cart')">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Cart</span>
            <div id="nav-cart-badge" class="cart-badge hidden">0</div>
        </button>
    </nav>

    <!-- MAIN APPLICATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const firebaseConfig = {
            apiKey: "AIzaSyD9_Qi9tJCyqUISQJ5QJ6gn9ZDW8D7aVbw",
            authDomain: "revolt-3a06d.firebaseapp.com",
            databaseURL: "https://revolt-3a06d-default-rtdb.firebaseio.com",
            projectId: "revolt-3a06d",
            storageBucket: "revolt-3a06d.firebasestorage.app",
            messagingSenderId: "323255440638",
            appId: "1:323255440638:web:75877fe3a9aaa55ccec1af"
        };
        const supabaseUrl = 'https://hianvppezhevucysqhut.supabase.co';
        const supabaseKey = 'sb_publishable_NtHxETL5zLnblcdnQiH2gw_uRHWDLhJ';
        
        let appInstance, db, auth, googleProvider;
        try {
            appInstance = initializeApp(firebaseConfig);
            db = getDatabase(appInstance);
            auth = getAuth(appInstance);
            googleProvider = new GoogleAuthProvider();
        } catch(e) { console.error("Firebase Init Error", e); }

        const supabase = createClient(supabaseUrl, supabaseKey);

        const resolveMediaUrl = (filename) => {
            if (!filename) return '';
            if (filename.startsWith('http')) return filename;
            return `${supabaseUrl}/storage/v1/object/public/proplay-assets/${filename}`;
        };

        const state = {
            products: [], banners: [], reels: [], orders: [],
            cart: JSON.parse(localStorage.getItem('novarevolt_cart')) || [],
            currentProduct: null,
            user: null,
            userId: localStorage.getItem('novarevolt_userid') || 'user_' + Math.random().toString(36).substr(2, 9),
            authMode: 'login'
        };
        localStorage.setItem('novarevolt_userid', state.userId);

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.user = user;
                    state.userId = user.uid;
                    localStorage.setItem('novarevolt_userid', state.userId);
                } else { state.user = null; }
            });
        }

        const showLoader = () => document.getElementById('global-loader').classList.remove('hidden');
        const hideLoader = () => document.getElementById('global-loader').classList.add('hidden');
        const hideSplash = () => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }
        };
        const showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
        const formatCurrency = (amt) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amt || 0);

        const updateCartBadge = () => {
            const badge = document.getElementById('nav-cart-badge');
            if(state.cart.length > 0) {
                badge.innerText = state.cart.length;
                badge.classList.remove('hidden');
            } else { badge.classList.add('hidden'); }
        }

        window.app = {};

        window.app.navigate = (screenId) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const targetScreen = document.getElementById(`${screenId}-screen`);
            if(targetScreen) targetScreen.classList.add('active');
            const navBtn = document.querySelector(`.nav-item[onclick="window.app.navigate('${screenId}')"]`);
            if(navBtn) navBtn.classList.add('active');

            if(screenId !== 'reels') document.querySelectorAll('.reel-video').forEach(v => v.pause());

            if (screenId === 'cart') renderCart();
            if (screenId === 'orders') fetchAndRenderOrders();
            if (screenId === 'home') { if(state.products.length === 0) fetchHomeData(); else renderProducts(state.products); }
            if (screenId === 'reels') {
                if(state.reels.length === 0) fetchReels();
                else setupReelsObserver();
            }
            window.scrollTo(0,0);
        };

        const fetchHomeData = async () => {
            showLoader();
            try {
                if (!db) throw new Error("Firebase DB not initialized.");
                const [bannersSnap, productsSnap] = await Promise.all([
                    get(child(ref(db), 'banners')), get(child(ref(db), 'products'))
                ]);

                if (bannersSnap.exists()) {
                    const bData = bannersSnap.val();
                    state.banners = Array.isArray(bData) ? bData : Object.keys(bData).map(k => ({id: k, ...bData[k]}));
                    renderBanners();
                }
                if (productsSnap.exists()) {
                    const pData = productsSnap.val();
                    state.products = Array.isArray(pData) ? pData : Object.keys(pData).map(k => ({id: k, ...pData[k]}));
                    renderProducts(state.products);
                }
            } catch (error) {
                const grid = document.getElementById('home-product-grid');
                if(grid) grid.innerHTML = `<div class="empty-state">Unable to load collection.</div>`;
            }
            updateCartBadge();
            hideLoader();
            hideSplash();
        };

        const renderBanners = () => {
            const track = document.getElementById('banner-track');
            track.innerHTML = ''; 
            if(state.banners.length === 0) return;

            state.banners.forEach((b) => {
                const slide = document.createElement('div');
                slide.className = 'banner-slide';
                slide.innerHTML = `<img src="${resolveMediaUrl(b.image || b.imageUrl)}" loading="lazy">`;
                track.appendChild(slide);
            });

            let currentSlide = 0;
            setInterval(() => {
                currentSlide = (currentSlide + 1) % state.banners.length;
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
            }, 4500);
        };

        window.app.handleSearch = () => {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = state.products.filter(p => p.title.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query)));
            renderProducts(filtered);
        };

        const renderProducts = (productsToRender) => {
            const grid = document.getElementById('home-product-grid');
            grid.innerHTML = '';
            if(productsToRender.length === 0) {
                grid.innerHTML = '<div class="empty-state">No products found.</div>';
                return;
            }

            productsToRender.forEach(p => {
                const mediaSrc = p.imageUrl || (p.images ? p.images[0] : null) || p.image;
                const imgUrl = resolveMediaUrl(mediaSrc);
                const currentPrice = p.price || 0;
                const originalPrice = p.originalPrice || Math.round(currentPrice * 1.5);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openProductDetails(p.id);
                // EXTREME LUXURY CARD - 2 per row
                card.innerHTML = `
                    <div class="product-image-container">
                        <img src="${imgUrl}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price-row">
                            <span class="price-current">${formatCurrency(currentPrice)}</span>
                            <span class="price-original">${formatCurrency(originalPrice)}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        const openProductDetails = async (productId) => {
            const product = state.products.find(p => p.id === productId);
            if(!product) return;
            state.currentProduct = product;
            
            state.selections = {
                size: product.sizes && product.sizes.length > 0 ? product.sizes[0] : null,
                color: product.colors && product.colors.length > 0 ? product.colors[0] : null,
                qty: 1
            };

            const container = document.getElementById('pd-content');
            const mediaSrc = product.videoUrl || product.videoFilename || product.imageUrl || (product.images ? product.images[0] : null) || product.image;
            const mediaUrl = resolveMediaUrl(mediaSrc);
            const isVideo = mediaUrl.match(/\.(mp4|webm|mov)$/i) != null;
            const mediaHtml = isVideo ? `<video src="${mediaUrl}" autoplay loop muted playsinline></video>` : `<img src="${mediaUrl}" alt="${product.title}">`;

            const sizesHtml = product.sizes ? `
                <div class="selector-group">
                    <span class="selector-label">Select Size</span>
                    <div class="selector-options" id="pd-sizes">
                        ${product.sizes.map(s => `<button class="selector-btn ${s === state.selections.size ? 'selected' : ''}" onclick="window.app.selectOption('size', '${s}')">${s}</button>`).join('')}
                    </div>
                </div>` : '';

            const colorsHtml = product.colors ? `
                <div class="selector-group">
                    <span class="selector-label">Select Color</span>
                    <div class="selector-options" id="pd-colors">
                        ${product.colors.map(c => `<button class="selector-btn ${c === state.selections.color ? 'selected' : ''}" onclick="window.app.selectOption('color', '${c}')">${c}</button>`).join('')}
                    </div>
                </div>` : '';

            container.innerHTML = `
                <div class="pd-layout">
                    <div class="pd-media">${mediaHtml}</div>
                    <div class="pd-details">
                        <h2 class="pd-title">${product.title}</h2>
                        <div class="pd-price">${formatCurrency(product.price)}</div>
                        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 30px; line-height: 1.7;">${product.description || 'Experience ultimate luxury and comfort with our premium streetwear collection.'}</p>
                        ${sizesHtml} ${colorsHtml}
                        <div class="selector-group">
                            <span class="selector-label">Quantity</span>
                            <div class="qty-wrapper">
                                <button class="qty-btn" onclick="window.app.updateQty(-1)">-</button>
                                <span class="qty-val" id="pd-qty">1</span>
                                <button class="qty-btn" onclick="window.app.updateQty(1)">+</button>
                            </div>
                        </div>
                        <button class="btn-primary" onclick="window.app.addToCart()">Add to Cart</button>
                        
                        <div class="reviews-section" id="dynamic-reviews-section">
                            <h3 style="font-size: 1.1rem; margin-bottom: 25px; font-weight: 800; letter-spacing:0.1em;">Reviews</h3>
                            <div id="reviews-list">Loading...</div>
                            
                            <div class="add-review-box">
                                <h4 style="margin-bottom:15px; font-size:0.85rem; color:#888;">Write a Review</h4>
                                <div class="star-rating-input" id="review-stars">
                                    <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
                                </div>
                                <input type="hidden" id="review-rating-val" value="5">
                                <input type="text" id="review-name" class="form-input" placeholder="Your Name" style="margin-bottom:15px; padding:10px 0;">
                                <textarea id="review-text" class="form-input" placeholder="Share your experience..." style="margin-bottom:15px; resize:vertical; min-height:50px; padding:10px 0;"></textarea>
                                <button class="btn-primary" style="padding:15px; font-size:0.8rem;" onclick="window.app.submitReview('${product.id}')">Submit</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('product-detail-screen').classList.add('active');
            window.scrollTo(0,0);

            await fetchAndRenderReviews(product.id);
            setupReviewStars();
        };

        const fetchAndRenderReviews = async (productId) => {
            const list = document.getElementById('reviews-list');
            try {
                const snap = await get(child(ref(db), `reviews/${productId}`));
                if(snap.exists()){
                    const data = snap.val();
                    const reviews = Object.keys(data).map(k => data[k]);
                    list.innerHTML = reviews.map(r => `
                        <div class="review-item">
                            <div class="review-head">
                                <div class="review-avatar">${r.name ? r.name.charAt(0) : 'U'}</div>
                                <div>
                                    <div class="review-name">${r.name || 'Anonymous'}</div>
                                    <div style="color: #000; font-size:0.8rem; letter-spacing:2px;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                                </div>
                            </div>
                            <p class="review-text">${r.text}</p>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:20px;">No reviews yet.</p>';
                }
            } catch(e) { list.innerHTML = 'Error loading reviews.'; }
        };

        const setupReviewStars = () => {
            const stars = document.querySelectorAll('#review-stars span');
            const hiddenInput = document.getElementById('review-rating-val');
            stars.forEach(s => s.classList.add('active'));

            stars.forEach(star => {
                star.onclick = function() {
                    const rating = this.getAttribute('data-val');
                    hiddenInput.value = rating;
                    stars.forEach(s => {
                        if(s.getAttribute('data-val') <= rating) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                };
            });
        };

        window.app.submitReview = async (productId) => {
            const name = document.getElementById('review-name').value.trim();
            const text = document.getElementById('review-text').value.trim();
            const rating = parseInt(document.getElementById('review-rating-val').value);

            if(!name || !text) return showToast("Name and text required");
            showLoader();
            try {
                await push(ref(db, `reviews/${productId}`), {
                    name, text, rating, timestamp: new Date().toISOString()
                });
                showToast("Review submitted!");
                document.getElementById('review-name').value = '';
                document.getElementById('review-text').value = '';
                await fetchAndRenderReviews(productId);
            } catch(e) { showToast("Failed to submit"); }
            hideLoader();
        };

        window.app.selectOption = (type, val) => {
            state.selections[type] = val;
            const container = document.getElementById(`pd-${type}s`);
            container.querySelectorAll('.selector-btn').forEach(btn => {
                if(btn.innerText === val) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
        };
        window.app.updateQty = (delta) => {
            let newQty = state.selections.qty + delta;
            if(newQty < 1) newQty = 1;
            state.selections.qty = newQty;
            document.getElementById('pd-qty').innerText = newQty;
        };

        window.app.addToCart = () => {
            const product = state.currentProduct;
            const mediaSrc = product.imageUrl || (product.images ? product.images[0] : null) || product.image;
            const item = {
                cartId: Date.now().toString(),
                productId: product.id,
                title: product.title,
                price: product.price,
                image: mediaSrc,
                size: state.selections.size,
                color: state.selections.color,
                qty: state.selections.qty
            };
            state.cart.push(item);
            localStorage.setItem('novarevolt_cart', JSON.stringify(state.cart));
            updateCartBadge();
            showToast('Added to Cart');
        };

        const renderCart = () => {
            const container = document.getElementById('cart-container');
            const summaryWrapper = document.getElementById('cart-summary-wrapper');
            container.innerHTML = '';

            if (state.cart.length === 0) {
                container.innerHTML = `<div class="empty-state">Your cart is empty.</div>`;
                summaryWrapper.classList.add('hidden');
                return;
            }

            let subtotal = 0;
            state.cart.forEach(item => {
                subtotal += (item.price * item.qty);
                const el = document.createElement('div');
                el.className = 'cart-item';
                el.innerHTML = `
                    <img src="${resolveMediaUrl(item.image)}" class="cart-item-img">
                    <div class="cart-item-details">
                        <div>
                            <div class="cart-item-title">${item.title}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; text-transform:uppercase; letter-spacing:0.05em;">${item.size ? `Size: ${item.size}` : ''} | Qty: ${item.qty}</div>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="cart-item-price">${formatCurrency(item.price * item.qty)}</div>
                            <span class="cart-remove" onclick="window.app.removeFromCart('${item.cartId}')">Remove</span>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
            document.getElementById('cart-subtotal').innerText = formatCurrency(subtotal);
            document.getElementById('cart-total').innerText = formatCurrency(subtotal);
            summaryWrapper.classList.remove('hidden');
        };

        window.app.removeFromCart = (cartId) => {
            state.cart = state.cart.filter(i => i.cartId !== cartId);
            localStorage.setItem('novarevolt_cart', JSON.stringify(state.cart));
            updateCartBadge();
            renderCart();
        };

        window.app.openAuth = () => { document.getElementById('auth-modal').classList.add('active'); };
        window.app.closeAuth = () => { document.getElementById('auth-modal').classList.remove('active'); };
        window.app.toggleAuthMode = () => {
            state.authMode = state.authMode === 'login' ? 'signup' : 'login';
            document.getElementById('auth-title').innerText = state.authMode === 'login' ? 'LOGIN' : 'REGISTER';
            document.getElementById('btn-auth-submit').innerText = state.authMode === 'login' ? 'Sign In' : 'Create Account';
            document.getElementById('auth-toggle-text').innerText = state.authMode === 'login' ? "Create an account" : "Sign in to existing account";
        };

        window.app.handleEmailAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            showLoader();
            try {
                if (state.authMode === 'signup') {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    showToast("Account created.");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                    showToast("Logged in.");
                }
                window.app.closeAuth();
                window.app.openCheckout(); 
            } catch (err) { showToast(err.message.replace('Firebase: ', '')); }
            hideLoader();
        };

        window.app.handleGoogleLogin = async () => {
            showLoader();
            try {
                await signInWithPopup(auth, googleProvider);
                showToast("Logged in.");
                window.app.closeAuth();
                window.app.openCheckout();
            } catch (err) { showToast("Login failed."); }
            hideLoader();
        };

        window.app.openCheckout = () => {
            if (!state.user) {
                window.app.openAuth();
                return;
            }
            document.getElementById('checkout-modal').classList.add('active');
            try {
                const saved = JSON.parse(localStorage.getItem('novarevolt_checkout_info') || '{}');
                if(saved.name) document.getElementById('co-name').value = saved.name;
                if(saved.phone) document.getElementById('co-phone').value = saved.phone;
                if(saved.address) document.getElementById('co-address').value = saved.address;
                if(saved.gpsLink) {
                    document.getElementById('co-gps-link').value = saved.gpsLink;
                    const st = document.getElementById('co-gps-status');
                    st.innerText = "Location loaded.";
                    st.style.color = "green";
                }
            } catch(e) {}
        };

        window.app.closeCheckout = () => { document.getElementById('checkout-modal').classList.remove('active'); };

        window.app.fetchLocation = () => {
            const status = document.getElementById('co-gps-status');
            status.innerText = "Fetching...";
            status.style.color = "#888";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                        document.getElementById('co-gps-link').value = link;
                        status.innerText = "Secured.";
                        status.style.color = "green";
                    },
                    (err) => {
                        status.innerText = "Failed. Enter manually.";
                        status.style.color = "red";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                status.innerText = "Not supported.";
                status.style.color = "red";
            }
        };

        window.app.placeOrder = (e) => {
            e.preventDefault();
            if (!db) return showToast('Database missing.');

            const btn = document.getElementById('btn-place-order');
            btn.innerText = 'Processing...'; btn.disabled = true;

            const name = document.getElementById('co-name').value;
            const phone = document.getElementById('co-phone').value;
            const address = document.getElementById('co-address').value;
            const gpsLink = document.getElementById('co-gps-link').value;

            let lat = null, lng = null;
            if (gpsLink && gpsLink.includes('?q=')) {
                const coords = gpsLink.split('?q=')[1].split(',');
                if (coords.length === 2) { lat = parseFloat(coords[0]); lng = parseFloat(coords[1]); }
            }

            localStorage.setItem('novarevolt_checkout_info', JSON.stringify({ name, phone, address, gpsLink }));

            const totalAmount = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const orderData = {
                userId: state.userId,
                customer: { name, phone, address, lat, lng, gpsLink },
                items: state.cart,
                totalAmount: totalAmount,
                status: 'Pending',
                timestamp: new Date().toISOString()
            };

            push(ref(db, 'orders')).then(newRef => {
                return set(newRef, orderData);
            }).then(() => {
                state.cart = [];
                localStorage.removeItem('novarevolt_cart');
                updateCartBadge();
                window.app.closeCheckout();
                showToast('Order Confirmed');
                btn.innerText = 'Complete Purchase'; btn.disabled = false;
                document.getElementById('checkout-form').reset();
                window.app.navigate('orders');
            }).catch(err => {
                showToast('Failed to order.');
                btn.innerText = 'Complete Purchase'; btn.disabled = false;
            });
        };

        /* =======================================
           UPDATED ORDER RENDER LOGIC (Status + Delivery Boy)
           ======================================= */
        const fetchAndRenderOrders = async () => {
            showLoader();
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            
            if(!state.user && state.userId.startsWith('user_')) {
                container.innerHTML = `<div class="empty-state"><p>Login to view orders.</p><button class="btn-primary" onclick="window.app.openAuth()" style="width:auto; margin:20px auto; padding:15px 35px;">Sign In</button></div>`;
                hideLoader();
                return;
            }

            try {
                if (!db) throw new Error("Firebase DB not initialized.");
                const snap = await get(child(ref(db), 'orders'));
                if (snap.exists()) {
                    const data = snap.val();
                    state.orders = Object.keys(data).map(k => ({id: k, ...data[k]}))
                                   .filter(o => o.userId === state.userId)
                                   .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                } else { state.orders = []; }

                if (state.orders.length === 0) {
                    container.innerHTML = `<div class="empty-state">No orders found.</div>`;
                } else {
                    state.orders.forEach(o => {
                        const d = new Date(o.timestamp);
                        const itemsHtml = o.items.map(i => `<div style="font-size:0.9rem; margin-bottom:8px; display:flex; justify-content:space-between;"><span>${i.qty}x ${i.title}</span><span>${formatCurrency(i.price * i.qty)}</span></div>`).join('');
                        
                        // FIX 1: Showing Status unconditionally and Track link if available
                        const statusText = o.status || 'Processing';
                        const statusHtml = `<span style="font-size:0.8rem; color:var(--text-secondary); font-weight:700; text-transform:uppercase; letter-spacing:0.1em;">Status: <span style="color:var(--text-color);">${statusText}</span></span>`;
                        const trackBtn = o.deliveryLink ? `<a href="${o.deliveryLink}" target="_blank" style="padding:8px 16px; background:#000; color:#fff; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em;">Track</a>` : '';
                        
                        // FIX 2: Delivery Boy Name, Number, and Call Button
                        let deliveryBoyHtml = '';
                        if (o.deliveryBoy && o.deliveryBoy.name && o.deliveryBoy.phone) {
                            deliveryBoyHtml = `
                                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border-color);">
                                    <div style="font-size:0.75rem; color:var(--text-secondary); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">Delivery Partner Info</div>
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <div>
                                            <div style="font-weight:700; font-size:0.95rem; text-transform:uppercase;">${o.deliveryBoy.name}</div>
                                            <div style="font-size:0.85rem; color:#444;">${o.deliveryBoy.phone}</div>
                                        </div>
                                        <a href="tel:${o.deliveryBoy.phone}" style="background:#000; color:#fff; padding:10px 15px; font-size:0.8rem; font-weight:700; text-transform:uppercase; text-decoration:none; display:flex; align-items:center; gap:5px;">
                                            📞 Call
                                        </a>
                                    </div>
                                </div>
                            `;
                        }
                        
                        const el = document.createElement('div');
                        el.className = 'order-card';
                        el.innerHTML = `
                            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding-bottom:15px; margin-bottom:20px;">
                                <span style="font-size:0.8rem; color:var(--text-secondary); font-weight:700; text-transform:uppercase; letter-spacing:0.1em;">#${o.id.substring(1, 9)}</span>
                                <span style="font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;">${d.toLocaleDateString()}</span>
                            </div>
                            <div style="margin-bottom:20px;">${itemsHtml}</div>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #eee; padding-top:15px; margin-bottom:15px;">
                                <span style="font-weight:800; font-size:1.3rem;">${formatCurrency(o.totalAmount)}</span>
                            </div>
                            
                            <!-- Status and Tracking Area -->
                            <div style="display:flex; justify-content:space-between; align-items:center; background: #f9f9f9; padding: 12px; border: 1px solid #eee;">
                                ${statusHtml}
                                ${trackBtn}
                            </div>

                            <!-- Delivery Boy Area -->
                            ${deliveryBoyHtml}
                        `;
                        container.appendChild(el);
                    });
                }
            } catch (error) { container.innerHTML = '<div class="empty-state">Failed to load orders.</div>'; }
            hideLoader();
        };

        const fetchReels = async () => {
            showLoader();
            try {
                if (!db) throw new Error("Firebase DB not initialized.");
                const snap = await get(child(ref(db), 'reels'));
                if (snap.exists()) {
                    const rData = snap.val();
                    state.reels = Array.isArray(rData) ? rData : Object.keys(rData).map(k => ({id: k, ...rData[k]}));
                    renderReels();
                } else { document.getElementById('reels-container').innerHTML = '<div class="empty-state" style="color:#fff; padding-top:50vh;">No collection available.</div>'; }
            } catch (error) { document.getElementById('reels-container').innerHTML = '<div class="empty-state" style="color:#fff; padding-top:50vh;">Error loading content.</div>'; }
            hideLoader();
        };

        const renderReels = () => {
            const container = document.getElementById('reels-container');
            container.innerHTML = '';
            state.reels.forEach(r => {
                const mediaSrc = r.videoUrl || r.videoFilename;
                const videoUrl = resolveMediaUrl(mediaSrc);
                const el = document.createElement('div');
                el.className = 'reel-item';
                el.innerHTML = `
                    <video class="reel-video" src="${videoUrl}" loop muted playsinline></video>
                    <div style="position:absolute; bottom:0; left:0; width:100%; padding:80px 20px 30px; background:linear-gradient(to top, rgba(0,0,0,0.9), transparent); color:#fff; pointer-events:none;">
                        <div style="font-size:1.4rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em;">${r.title || 'Exclusive'}</div>
                    </div>
                `;
                container.appendChild(el);
            });
            setupReelsObserver();
        };

        const setupReelsObserver = () => {
            const videos = document.querySelectorAll('.reel-video');
            if(videos.length === 0) return;
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) { video.play().catch(e=>console.log(e)); } 
                    else { video.pause(); }
                });
            }, { threshold: 0.6 });
            videos.forEach(v => {
                observer.observe(v);
                v.onclick = () => { v.muted ? (v.muted = false) : (v.paused ? v.play() : v.pause()); };
            });
        };

        window.addEventListener('DOMContentLoaded', () => { window.app.navigate('home'); });

    </script>
</body>
</html>
